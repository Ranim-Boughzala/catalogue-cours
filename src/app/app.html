<app-en-tete></app-en-tete>
<nav class="menu">
    <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact:
true }">Accueil</a>
    <a routerLink="/cours" routerLinkActive="actif">Catalogue</a>
    <a routerLink="/mes-inscriptions" routerLinkActive="actif">
        Mes inscriptions ({{ inscriptions.liste().length }})
      </a> @if (session.connecte()) {
    <span>Bonjour {{ session.nom() }}</span>
    <button (click)="deconnecter()">Déconnexion</button> } @else {
    <a routerLink="/connexion" routerLinkActive="actif">Connexion</a> }
</nav>
<main>
    <router-outlet />
</main>
@defer (on viewport) {
<app-pied-page></app-pied-page>
} @placeholder {
<div class="pied-page-placeholder">...</div>
} @loading {
<p>Chargement...</p>
}
